name: Kristal project checks and builds

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    name: Validate manifest and Lua syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 rsync zip

      - name: Validate mod.json
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("mod.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          required = ("id", "name", "version", "engineVer", "chapter", "encounter", "party")
          missing = [key for key in required if key not in manifest]
          if missing:
              raise SystemExit("mod.json is missing required fields: " + ", ".join(missing))

          if not isinstance(manifest["party"], list) or not manifest["party"]:
              raise SystemExit("mod.json party must be a non-empty array")

          if "darkInventory" in manifest:
              raise SystemExit("Use Kristal's 'inventory' field, not 'darkInventory'")

          print("mod.json is valid")
          print("Project:", manifest["name"])
          print("Engine target:", manifest["engineVer"])
          print("Initial encounter:", manifest["encounter"])
          PY

      - name: Validate every Lua script
        run: |
          mapfile -t scripts < <(find . -type f -name '*.lua' -not -path './.git/*' | sort)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No Lua files found"
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "Checking $script"
            luac5.1 -p "$script"
          done

      - name: Test flavor text registry
        run: lua5.1 tests/flavor_text_test.lua

      - name: Test runtime spell effects
        run: lua5.1 tests/runtime_spells_test.lua

      - name: Verify runtime scaffold paths
        run: |
          test -f mod.lua
          test -f scripts/battle/encounters/runtime_smoke_test.lua
          test -f scripts/battle/enemies/runtime_dummy.lua
          test -f scripts/battle/waves/runtime_smoke.lua
          test -f scripts/battle/bullets/runtime_test_bullet.lua
          for member in kris susie ralsei noelle berdly; do test -f "data/party/$member.lua"; done
          for spell in ts_rush ts_brighten ts_heal ts_revivesong ts_ice_shock ts_ice_wave ts_tornado; do test -f "data/spells/$spell.lua"; done
          test ! -d scripts/data/party
          test ! -d scripts/data/spells
          grep -q 'registerAct("Inspect"' scripts/battle/enemies/runtime_dummy.lua
          grep -q 'registerActFor("kris", "Signal"' scripts/battle/enemies/runtime_dummy.lua
          grep -q 'Standard = "\* The standard X-ACT handler works\.' scripts/battle/enemies/runtime_dummy.lua
          for shadow in TOAD NUE "DIVINE DOG" "GREAT SERPENT" "MAX ELEPHANT" "RABBIT ESCAPE" "ROUND DEER" "PIERCING OX" "TIGER FUNERAL" MAHORAGA; do
            grep -Fq "{\"$shadow\"," scripts/battle/enemies/runtime_dummy.lua
          done
          grep -q 'CHIMERA SHADOW GARDEN' scripts/battle/enemies/runtime_dummy.lua
          grep -q 'runtime_test_bullet' scripts/battle/waves/runtime_smoke.lua
          echo "Runtime scaffold, registry-loaded five-member party, spells, domain, and Ten Shadows checks passed"

      - name: Stage clean Kristal mod folder
        run: |
          mkdir -p dist/Ten-Shadows-Kris
          cp mod.json mod.lua dist/Ten-Shadows-Kris/
          for dir in assets data scripts libraries preview; do
            if [ -d "$dir" ]; then
              mkdir -p "dist/Ten-Shadows-Kris/$dir"
              rsync -a --exclude='*.md' --exclude='*.html' --exclude='*.js' \
                "$dir/" "dist/Ten-Shadows-Kris/$dir/"
            fi
          done

      - name: Package Kristal test project
        run: |
          cd dist
          zip -9 -r ../Ten-Shadows-Kris-test.zip Ten-Shadows-Kris

      - name: Upload test project
        uses: actions/upload-artifact@v5
        with:
          name: Ten-Shadows-Kris-test
          path: Ten-Shadows-Kris-test.zip
          if-no-files-found: error

  build-love:
    name: Build standalone LÖVE archive
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ten Shadows Kris
        uses: actions/checkout@v5

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rsync zip

      - name: Check out matching Kristal engine
        uses: actions/checkout@v5
        with:
          repository: KristalTeam/Kristal
          ref: v0.10.0
          path: kristal-engine

      - name: Integrate mod into Kristal
        run: |
          rm -rf kristal-engine/mods/example
          mkdir -p kristal-engine/mods/ten_shadows_kris
          cp mod.json mod.lua kristal-engine/mods/ten_shadows_kris/
          for dir in assets scripts libraries preview; do
            if [ -d "$dir" ]; then
              mkdir -p "kristal-engine/mods/ten_shadows_kris/$dir"
              rsync -a --exclude='*.md' --exclude='*.html' --exclude='*.js' \
                "$dir/" "kristal-engine/mods/ten_shadows_kris/$dir/"
            fi
          done

          python3 - <<'PY'
          from pathlib import Path

          vendcust_path = Path("kristal-engine/src/engine/vendcust.lua")
          vendcust = vendcust_path.read_text(encoding="utf-8")
          vendcust = vendcust.replace("TARGET_MOD = nil", 'TARGET_MOD = "ten_shadows_kris"')
          vendcust = vendcust.replace("AUTO_MOD_START = false", "AUTO_MOD_START = true")
          if 'TARGET_MOD = "ten_shadows_kris"' not in vendcust:
              raise SystemExit("Could not configure Kristal TARGET_MOD")
          if "AUTO_MOD_START = true" not in vendcust:
              raise SystemExit("Could not configure Kristal AUTO_MOD_START")
          vendcust_path.write_text(vendcust, encoding="utf-8")

          conf_path = Path("kristal-engine/conf.lua")
          conf = conf_path.read_text(encoding="utf-8")
          conf = conf.replace('t.identity = "kristal"', 't.identity = "ten_shadows_kris"')
          conf = conf.replace('t.window.title = "Kristal"', 't.window.title = "Ten Shadows Kris"')
          if 't.identity = "ten_shadows_kris"' not in conf:
              raise SystemExit("Could not set the game save identity")
          if 't.window.title = "Ten Shadows Kris"' not in conf:
              raise SystemExit("Could not set the game window title")
          conf_path.write_text(conf, encoding="utf-8")
          PY

      - name: Build and verify .love archive
        run: |
          cd kristal-engine

          # Kristal reads this root-level file at startup to initialize SemVer.
          test -s VERSION
          grep -Eq '^[v]?[0-9]+([.][0-9]+){0,2}([+-].*)?$' VERSION

          zip -9 -r ../Ten-Shadows-Kris.love \
            VERSION assets configs data data_templates lib mods src \
            conf.lua gamecontrollerdb.txt icon.png main.lua LICENSE
          cd ..

          unzip -Z1 Ten-Shadows-Kris.love | grep -qx 'VERSION'
          unzip -p Ten-Shadows-Kris.love VERSION | grep -Eq '^[v]?[0-9]+([.][0-9]+){0,2}([+-].*)?$'
          unzip -Z1 Ten-Shadows-Kris.love | grep -qx 'main.lua'
          unzip -Z1 Ten-Shadows-Kris.love | grep -q '^mods/ten_shadows_kris/mod.json$'
          if unzip -Z1 Ten-Shadows-Kris.love | grep -Eq '(^|/)\.git/|\.html$'; then
            echo "Unexpected development or HTML files found in .love archive"
            exit 1
          fi
          echo "Standalone LÖVE archive structure and VERSION verified"

      - name: Upload standalone .love archive
        uses: actions/upload-artifact@v5
        with:
          name: Ten-Shadows-Kris-love
          path: Ten-Shadows-Kris.love
          if-no-files-found: error
