name: Kristal project checks and builds

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    name: Validate manifest and Lua syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Lua 5.1
        run: |
          sudo apt-get install --yes lua5.1
          command -v rsync
          command -v zip

      - name: Validate mod.json
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("mod.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          required = ("id", "name", "version", "engineVer", "chapter", "encounter", "party")
          missing = [key for key in required if key not in manifest]
          if missing:
              raise SystemExit("mod.json is missing required fields: " + ", ".join(missing))

          if not isinstance(manifest["party"], list) or not manifest["party"]:
              raise SystemExit("mod.json party must be a non-empty array")

          if "darkInventory" in manifest:
              raise SystemExit("Use Kristal's 'inventory' field, not 'darkInventory'")

          print("mod.json is valid")
          print("Project:", manifest["name"])
          print("Engine target:", manifest["engineVer"])
          print("Initial encounter:", manifest["encounter"])
          PY

      - name: Verify new-file boss entry point
        run: python3 tests/manifest_startup_test.py

      - name: Test TOASTER translator and missing-translator fallback
        run: |
          python3 tests/fpp_transpiler_test.py
          python3 tests/fpp_build_test.py
          python3 tests/fsharp_bridge_test.py
          python3 tools/fsharp_bridge.py examples/hello.f# --to lua -o /tmp/fsharp-hello.lua
          luac5.1 -p /tmp/fsharp-hello.lua
          lua5.1 tests/boss_phase_test.lua
          lua5.1 tests/knight_titan_scheduler_test.lua
          lua5.1 tests/attack_wave_patterns_test.lua
          lua5.1 tests/shadow_projectile_test.lua
          lua5.1 tests/cyan_soul_test.lua
          python3 tools/toaster.py examples/hello.fpp -o /tmp/fpp-hello.lua
          luac5.1 -p /tmp/fpp-hello.lua

      - name: Build F++ mod sources for Kristal
        run: python3 tools/build_fpp.py

      - name: Validate every Lua script
        run: |
          mapfile -t scripts < <(find . -type f -name '*.lua' -not -path './.git/*' | sort)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No Lua files found"
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "Checking $script"
            luac5.1 -p "$script"
          done

      - name: Test flavor text registry
        run: lua5.1 tests/flavor_text_test.lua

      - name: Test runtime spell effects
        run: lua5.1 tests/runtime_spells_test.lua

      - name: Test grouped BRIGHTEN ACT
        run: lua5.1 tests/brighten_act_test.lua

      - name: Test Ten Shadows effects and Attack scaling
        run: lua5.1 tests/runtime_shadows_test.lua

      - name: Test combat balance and equipment blacklist
        run: lua5.1 tests/combat_balance_test.lua

      - name: Test Vessel SOUL-mode boss attacks
        run: lua5.1 tests/soul_mode_attacks_test.lua

      - name: Test six-member party registration and UI
        run: lua5.1 tests/six_party_test.lua

      - name: Test Berdly actor configuration isolation
        run: lua5.1 tests/berdly_actor_test.lua

      - name: Test Vessel identity profile and save import
        run: lua5.1 tests/vessel_identity_test.lua
      - name: Test Vessel identity menu and first-run setup
        run: lua5.1 tests/vessel_identity_menu_test.lua
      - name: Test Vessel first-run encounter ordering
        run: lua5.1 tests/vessel_identity_startup_test.lua

      - name: Test Vessel sprite configuration
        run: lua5.1 tests/vessel_actor_test.lua

      - name: Test Berdly sprite-map coverage
        run: lua5.1 tests/berdly_sprite_map_test.lua

      - name: Test Berdly B-Action
        run: lua5.1 tests/berdly_xaction_test.lua

      - name: Verify runtime scaffold paths
        run: |
          test -f mod.lua
          test -f scripts/battle/encounters/runtime_smoke_test.lua
          test -f scripts/battle/encounters/knight_titan_preview.lua
          test -f scripts/battle/waves/knight_titan_assault.lua
          test -f scripts/battle/bullets/shadow_projectile.lua
          test -f scripts/ten_shadows/attack_wave_patterns.lua
          test -f tests/attack_wave_patterns_test.lua
          test -f tests/shadow_projectile_test.lua
          test -f tests/cyan_soul_test.lua
          test -f scripts/objects/cyan_soul.lua
          test -f tests/brighten_act_test.lua
          test -f tests/knight_titan_scheduler_test.lua
          grep -q 'Patterns.build' scripts/battle/waves/knight_titan_assault.lua
          grep -q 'shot.warning' scripts/battle/waves/knight_titan_assault.lua
          grep -q 'function ShadowProjectile:arm()' scripts/battle/bullets/shadow_projectile.lua
          grep -q 'function CyanSoul:releaseCharge()' scripts/objects/cyan_soul.lua
          grep -q 'function state:parryExecution()' scripts/ten_shadows/combat_state.lua
          grep -q 'cyan_knights_execution' scripts/ten_shadows/attack_wave_patterns.lua
          grep -q 'EXECUTION COUNTER' scripts/battle/enemies/roaring_knight_titan.lua
          grep -q 'self:consumeKnightDisruption(false)' scripts/ten_shadows/combat_state.lua
          grep -q 'state:tickEnemyTurnEffects()' scripts/battle/waves/knight_titan_assault.lua
          grep -q 'Shadows.onEnemyTurnEnd(enemy)' scripts/battle/waves/knight_titan_assault.lua
          grep -q 'Shadows.use(name, battler, self)' scripts/battle/enemies/roaring_knight_titan.lua
          grep -q 'state:setSoulMode(soul_mode)' scripts/battle/enemies/roaring_knight_titan.lua
          grep -q 'state:expandChimeraDomain(true)' scripts/battle/enemies/roaring_knight_titan.lua
          grep -q 'function KnightTitanPreview:onBattleEnd()' scripts/battle/encounters/knight_titan_preview.lua
          grep -q 'CHIMERA SHADOW GARDEN' mod.lua
          test -f scripts/battle/enemies/roaring_knight_titan.lua
          test -f scripts/ten_shadows/boss_phase.lua
          test -f tests/boss_phase_test.lua
          test -f scripts/battle/enemies/runtime_dummy.lua
          test -f scripts/battle/waves/runtime_smoke.lua
          test -f scripts/battle/bullets/runtime_test_bullet.lua
          test -f tests/soul_mode_attacks_test.lua
          test -f tests/six_party_test.lua
          test -f tests/berdly_actor_test.lua
          test -f tests/berdly_sprite_map_test.lua
          test -f tests/berdly_xaction_test.lua
          test -f scripts/ten_shadows/berdly_actions.lua
          grep -q 'BerdlyActions.install()' mod.lua
          test -f assets/sprites/characters/berdly/animation-map.json
          test -f assets/sprites/party/README.md
          test -f assets/sprites/party/berdly/dark/README.md
          grep -q 'SOUL_MODE_ATTACKS' scripts/ten_shadows/combat_state.lua
          grep -q 'self.disable_mercy = true' scripts/battle/enemies/roaring_knight_titan.lua
          grep -q 'self.can_freeze = false' scripts/battle/enemies/roaring_knight_titan.lua
          grep -q 'BossPhase.advance' scripts/battle/enemies/roaring_knight_titan.lua
          for member in kris susie ralsei noelle berdly vessel; do test -f "scripts/data/party/$member.lua"; done
          test -f scripts/ten_shadows/vessel_identity.lua
          test -f tests/vessel_identity_test.lua
          test -f scripts/ten_shadows/vessel_identity_startup.lua
          test -f tests/vessel_identity_startup_test.lua
          grep -q "Mod.vessel_identity.load()" mod.lua
          grep -q "self.pronouns = identity.pronouns" scripts/data/party/vessel.lua
          test -f scripts/data/actors/vessel.lua
          grep -q 'sprite.scale_y = 1.15' scripts/data/actors/vessel.lua
          grep -q 'function copyActorValue(value, seen)' scripts/data/actors/vessel.lua
          test -f tests/vessel_actor_test.lua
          grep -q 'function Actions.install()' scripts/ten_shadows/berdly_actions.lua
          grep -q 'EnemyBattler.onAct = function' scripts/ten_shadows/berdly_actions.lua
          grep -q 'function Actions.getXAction(battler)' scripts/ten_shadows/berdly_actions.lua
          grep -q 'return "B-Action"' scripts/ten_shadows/berdly_actions.lua
          grep -q 'enemy.ten_shadows_exposed_turns' scripts/ten_shadows/berdly_actions.lua
          test -f scripts/data/actors/berdly.lua
          grep -q 'Class(Actor, "berdly")' scripts/data/actors/berdly.lua
          grep -q 'self:setActor("berdly")' scripts/data/party/berdly.lua
          grep -q 'Registry.getActor("kris")' scripts/data/actors/vessel.lua
          grep -q 'vessel_gray_red_outline' scripts/data/actors/vessel.lua
          grep -q 'self:setActor("vessel")' scripts/data/party/vessel.lua
          test -f scripts/world/maps/test_room.lua
          for gear in shadow_cloak ironhide_vest healing_sash frost_guard aero_cape soul_anchor; do
            test -f "scripts/data/items/armor/$gear.lua"
          done
          grep -q 'backgroundcolor' scripts/world/maps/test_room.lua
          grep -q 'class = "collision"' scripts/world/maps/test_room.lua
          grep -q 'name="spawn"' scripts/world/maps/test_room.lua
          python3 - <<'PY'
          import json
          from pathlib import Path

          berdly_map = json.loads(Path('assets/sprites/characters/berdly/animation-map.json').read_text(encoding='utf-8'))
          assert berdly_map['character'] == 'berdly'
          assert len(berdly_map['groups']) == 23
          assert berdly_map['source']['animation_groups_listed'] == 23
          assert all(group['frame_data_status'] == 'not-mapped' for group in berdly_map['groups'])
          assert all('actor_variant' in group for group in berdly_map['groups'])
          assert 'party/berdly/dark' in Path('scripts/data/actors/berdly.lua').read_text(encoding='utf-8')
          assert all(group['actor_variant'] == 'berdly' for group in berdly_map['groups'] if '(Dark World)' in group['source_group'])

          room_source = Path("scripts/world/maps/test_room.lua").read_text(encoding="utf-8")
          assert 'name="savepoint"' in room_source, "Test room must use Kristal's native savepoint event name"
          assert 'class="savepoint"' not in room_source, "Savepoint is selected by object name, not the Tiled class field"
          assert 'marker="spawn"' in room_source and 'heals=true' in room_source
          assert 'text1_1="* The shadows gather quietly around you."' in room_source
          smoke_source = Path("scripts/battle/encounters/runtime_smoke_test.lua").read_text(encoding="utf-8")
          assert "function RuntimeSmokeTest:onBattleEnd()" in smoke_source
          assert "Shadows.onBattleEnd()" in smoke_source, "Encounter must restore temporary Mahoraga on battle end"

          manifest = json.load(open("mod.json", encoding="utf-8"))
          assert manifest["party"] == ["kris", "susie", "ralsei", "noelle", "berdly", "vessel"], manifest["party"]
          source = open("mod.lua", encoding="utf-8").read()
          startup_source = open("scripts/ten_shadows/vessel_identity_startup.lua", encoding="utf-8").read()
          assert "local original_battle_transition_out = Battle.onTransitionOutState" in source
          assert "Shadows.onBattleEnd()" in source
          assert 'local PARTY_ROSTER = {"kris", "susie", "ralsei", "noelle", "berdly", "vessel"}' in source
          assert 'installGameLoadHook(Mod, Game, PARTY_ROSTER)' in source
          assert 'local original_game_load = game_class.load' in startup_source
          assert 'data.party[i] = id' in startup_source
          assert 'mod._vessel_identity_game_load_hook' in startup_source
          assert 'installSixPartySupport()' in source
          assert 'Game:setPartyMembers(unpack(roster))' in source
          assert 'assert(#Game.party == 6 and Game.party[6].id == "vessel"' in source
          assert 'for _, id in ipairs(roster) do' in source
          assert 'assert(Game:getPartyMember(id)' in source

          # Regression guard: battle creation iterates the validated complete roster.
          assert 'for i = 1, #Game.party do' in source
          assert 'Game:setPartyMembers(unpack(roster))' in source
          assert 'Vessel missing from the battle roster' in source
          assert 'local original_update_selected_boxes = DarkMenu.updateSelectedBoxes' in source
          assert 'local page_offset = selected > 3 and 3 or 0' in source
          assert 'math.min(3, #Game.party)' not in source
          assert 'ui.action_boxes' in source and 'syncSixPartyActionBoxes' in source
          assert 'local page_offset = selecting > 3 and 3 or 0' in source
          assert 'local original_battle_ui_draw = BattleUI.draw' in source
          assert 'local original_action_select_state = Battle.onActionSelectState' in source

          expected_gear = {
              "kris": "shadow_cloak",
              "susie": "ironhide_vest",
              "ralsei": "healing_sash",
              "noelle": "frost_guard",
              "berdly": "aero_cape",
              "vessel": "soul_anchor",
          }
          expected_weapons = {
              "kris": "ten_shadow_blade",
              "susie": "roaring_axe",
              "ralsei": "verdant_staff",
              "noelle": "glacier_ring",
              "berdly": "storm_halberd",
              "vessel": "soul_rapier",
          }
          for member, gear in expected_gear.items():
              party_source = open(f"scripts/data/party/{member}.lua", encoding="utf-8").read()
              assert f'self:setArmor(1, "{gear}")' in party_source, (member, gear)
              assert f'self.can_equip = {{{member} = true}}' in open(f"scripts/data/items/armor/{gear}.lua", encoding="utf-8").read()
          for member, weapon in expected_weapons.items():
              party_source = open(f"scripts/data/party/{member}.lua", encoding="utf-8").read()
              assert f'self:setWeapon("{weapon}")' in party_source, (member, weapon)
              assert Path(f"scripts/data/items/weapons/{weapon}.lua").is_file(), weapon
          PY
          for spell in ts_rush ts_brighten ts_heal ts_revivesong ts_ice_shock ts_ice_wave ts_tornado ts_snowgrave scythemare; do test -f "scripts/data/spells/$spell.lua"; done
          grep -q 'registerAct("Inspect"' scripts/battle/enemies/runtime_dummy.lua
          grep -q 'registerActFor("kris", "Signal"' scripts/battle/enemies/runtime_dummy.lua
          grep -q 'Standard = "\* The standard X-ACT handler works\.' scripts/battle/enemies/runtime_dummy.lua
          for shadow in TOAD NUE "DIVINE DOG" "GREAT SERPENT" "MAX ELEPHANT" "RABBIT ESCAPE" "ROUND DEER" "PIERCING OX" "TIGER FUNERAL" MAHORAGA; do
            grep -Fq "{\"$shadow\"," scripts/battle/enemies/runtime_dummy.lua
          done
          grep -q 'CHIMERA SHADOW GARDEN' scripts/battle/enemies/runtime_dummy.lua
          grep -q 'local PARTY_ROSTER = {"kris", "susie", "ralsei", "noelle", "berdly", "vessel"}' mod.lua
          grep -q 'installGameLoadHook(Mod, Game, PARTY_ROSTER)' mod.lua
          grep -q 'local original_game_load = game_class.load' scripts/ten_shadows/vessel_identity_startup.lua
          grep -q 'data.party\[i\] = id' scripts/ten_shadows/vessel_identity_startup.lua
          grep -q 'installSixPartySupport()' mod.lua
          grep -q 'Game:setPartyMembers(unpack(roster))' mod.lua
          grep -q 'local original_update_selected_boxes = DarkMenu.updateSelectedBoxes' mod.lua
          grep -q 'self.menu_icon = "party/kris/head"' scripts/data/party/vessel.lua
          grep -q 'runtime_test_bullet' scripts/battle/waves/runtime_smoke.lua
          grep -q 'self.has_act = false' scripts/data/party/susie.lua
          grep -q 'self.has_act = false' scripts/data/party/ralsei.lua
          grep -q 'self.has_act = true' scripts/data/party/kris.lua
          grep -q 'magic = 10' scripts/data/party/kris.lua
          grep -q 'runtime_shadows' scripts/battle/enemies/runtime_dummy.lua
          test -f scripts/data/party/mahoraga.lua
          grep -q 'function Shadows.summonMahoraga' scripts/ten_shadows/runtime_shadows.lua
          grep -q 'WITH THIS TREASURE' scripts/ten_shadows/runtime_shadows.lua
          if grep -Eq 'registerActFor\("(susie|ralsei|noelle|berdly)"' scripts/battle/enemies/runtime_dummy.lua; then exit 1; fi
          grep -q 'function Mod:onBattleEnemySelect' mod.lua
          grep -q 'TEN SHADOWS' mod.lua
          grep -q 'SOUL MODE' mod.lua
          echo "Runtime scaffold, six-member party, nested ACT menus, spells, domain, and Ten Shadows checks passed"

      - name: Stage clean Kristal mod folder (not a standalone game)
        run: |
          mkdir -p dist/Deltarune-Shadowbender
          cp mod.json mod.lua dist/Deltarune-Shadowbender/
          for dir in assets data scripts libraries preview; do
            if [ -d "$dir" ]; then
              mkdir -p "dist/Deltarune-Shadowbender/$dir"
              rsync -a --exclude='*.md' --exclude='*.html' --exclude='*.js' \
                "$dir/" "dist/Deltarune-Shadowbender/$dir/"
            fi
          done

      - name: Package Kristal mod for an existing engine
        run: |
          cd dist
          zip -9 -r ../Deltarune-Shadowbender-mod.zip Deltarune-Shadowbender

      - name: Upload Kristal mod package
        uses: actions/upload-artifact@v6
        with:
          name: Deltarune-Shadowbender-mod-only-Kristal-v0.10.0
          path: Deltarune-Shadowbender-mod.zip
          if-no-files-found: error

  build-love:
    name: Build standalone LÖVE archive
    # Run alongside static-checks to avoid serializing two independent jobs.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Deltarune Shadowbender
        uses: actions/checkout@v5

      - name: Install packaging tools
        run: |
          sudo apt-get install --yes lua5.1
          command -v rsync
          command -v zip

      - name: Check out matching Kristal engine
        uses: actions/checkout@v5
        with:
          repository: KristalTeam/Kristal
          ref: v0.10.0
          path: kristal-engine

      - name: Make the startup error screen independent of asset loading
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("kristal-engine/src/kristal.lua")
          source = path.read_text(encoding="utf-8")
          start_marker = "function Kristal.errorHandler(msg, trace_level)"
          end_marker = chr(10) + "function Kristal.isLoading()"
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          handler = source[start:end]

          def replace_once(text, old, new):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one occurrence of {old!r}, found {count}")
              return text.replace(old, new, 1)

          # The first reset used to run before the handler checked whether
          # LÖVE's graphics subsystem was available.
          first_reset = handler.index("    Draw.reset()")
          guard_block = (
              "    if not love or not love.graphics or not love.event or not love.window then" + chr(10)
              + "        return" + chr(10) + "    end" + chr(10) + chr(10)
              + "    love.graphics.reset()"
          )
          handler = handler[:first_reset] + guard_block + handler[first_reset + len("    Draw.reset()"):]
          # The crash UI uses LÖVE's built-in font, never a file-backed font.
          handler = replace_once(
              handler,
              'love.graphics.newFont("assets/fonts/main.ttf", 32, "mono")',
              "love.graphics.newFont(32)",
          )
          handler = replace_once(
              handler,
              'love.graphics.newFont("assets/fonts/main.ttf", 16, "mono")',
              "love.graphics.newFont(16)",
          )

          # Remove the banana/Starwalker sprite loads entirely.
          art_init_start = handler.index("    local starwalker, starwalkertext, banana_anim")
          art_init_end = handler.index("    local critical = false", art_init_start)
          handler = handler[:art_init_start] + handler[art_init_end:]
          handler = handler.replace(
              "    local starwalker_error = (love.math.random(100) <= 5) -- 5% chance for starwalker" + chr(10),
              "",
          )

          # Replace the decorative image animation in the draw callback with
          # nothing: the error screen is deliberately text-only.
          draw_start = handler.index("    local function draw()")
          art_start = handler.index("        if starwalker_error then", draw_start)
          art_end = handler.index("        -- DT shouldnt exceed 30FPS", art_start)
          handler = handler[:art_start] + handler[art_end:]
          handler = handler.replace(
              "        -- DT shouldnt exceed 30FPS" + chr(10)
              + "        DT = math.min(love.timer.getDelta(), 1 / 30)" + chr(10) + chr(10),
              "",
          )

          # Do not depend on the optional Draw utility for the crash screen.
          handler = handler.replace("    Draw.reset()", "    love.graphics.reset()")
          handler = handler.replace("        Draw.reset()", "        love.graphics.reset()")
          handler = handler.replace("Draw.setColor(1, 1, 1, 1)", "love.graphics.setColor(1, 1, 1, 1)")
          handler = handler.replace("Draw.setColor(0, 0, 0, 0.7)", "love.graphics.setColor(0, 0, 0, 0.7)")
          handler = handler.replace("Draw.setColor(copy_color)", "love.graphics.setColor(copy_color[1], copy_color[2], copy_color[3], copy_color[4])")

          forbidden = ("assets/", "newImage(", "Draw.", "starwalker", "banana_")
          leftovers = [token for token in forbidden if token in handler]
          if leftovers:
              raise SystemExit(f"Crash handler still has asset dependencies: {leftovers}")
          if "love.graphics.newFont(32)" not in handler or "love.graphics.newFont(16)" not in handler:
              raise SystemExit("Crash handler is missing built-in font fallbacks")

          source = source[:start] + handler + source[end:]
          path.write_text(source, encoding="utf-8")


      - name: Make missing window icons safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("kristal-engine/src/kristal.lua")
          source = path.read_text(encoding="utf-8")
          old = """function Kristal.setDesiredWindowTitleAndIcon()
              local mod = shouldWindowUseModBranding()
              love.window.setIcon(mod and mod.window_icon_data or Kristal.icon)
              love.window.setTitle(mod and mod.name or Kristal.game_default_name)
          end"""
          new = """function Kristal.setDesiredWindowTitleAndIcon()
              local mod = shouldWindowUseModBranding()
              local icon_data = mod and mod.window_icon_data or Kristal.icon

              -- A standalone build may intentionally disable the optional
              -- conf.lua window icon. Do not pass nil to LÖVE's setIcon().
              if icon_data then
                  love.window.setIcon(icon_data)
              end

              love.window.setTitle(mod and mod.name or Kristal.game_default_name)
          end"""
          if source.count(old) != 1:
              raise SystemExit(
                  "Expected exactly one Kristal window-branding function; "
                  f"found {source.count(old)}"
              )
          source = source.replace(old, new, 1)
          if "if icon_data then" not in source:
              raise SystemExit("Window icon nil guard was not installed")
          path.write_text(source, encoding="utf-8")
          PY

      - name: Validate patched Kristal Lua syntax
        run: |
          luac5.1 -p kristal-engine/src/kristal.lua
          grep -A 10 -F 'function Kristal.setDesiredWindowTitleAndIcon()' kristal-engine/src/kristal.lua | grep -Fq 'if icon_data then'

      - name: Verify and build F++ sources before Kristal integration
        run: python3 tools/build_fpp.py

      - name: Integrate mod into Kristal
        run: |
          rm -rf kristal-engine/mods/example
          mkdir -p kristal-engine/mods/ten_shadows_kris
          cp mod.json mod.lua kristal-engine/mods/ten_shadows_kris/
          for dir in assets data scripts libraries preview; do
            if [ -d "$dir" ]; then
              mkdir -p "kristal-engine/mods/ten_shadows_kris/$dir"
              rsync -a --exclude='*.md' --exclude='*.html' --exclude='*.js' \
                "$dir/" "kristal-engine/mods/ten_shadows_kris/$dir/"
            fi
          done

          python3 - <<'PY'
          from pathlib import Path

          vendcust_path = Path("kristal-engine/src/engine/vendcust.lua")
          vendcust = vendcust_path.read_text(encoding="utf-8")
          vendcust = vendcust.replace("TARGET_MOD = nil", 'TARGET_MOD = "ten_shadows_kris"')
          vendcust = vendcust.replace("AUTO_MOD_START = false", "AUTO_MOD_START = true")
          if 'TARGET_MOD = "ten_shadows_kris"' not in vendcust:
              raise SystemExit("Could not configure Kristal TARGET_MOD")
          if "AUTO_MOD_START = true" not in vendcust:
              raise SystemExit("Could not configure Kristal AUTO_MOD_START")
          vendcust_path.write_text(vendcust, encoding="utf-8")

          conf_path = Path("kristal-engine/conf.lua")
          conf = conf_path.read_text(encoding="utf-8")
          conf = conf.replace('t.identity = "kristal"', 't.identity = "ten_shadows_kris"')
          conf = conf.replace('t.window.title = "Kristal"', 't.window.title = "Deltarune: Shadowbender"')
          icon_setting = 't.window.icon = "icon.png"'
          if conf.count(icon_setting) != 1:
              raise SystemExit("Expected exactly one optional Kristal window icon setting")
          # The native window icon is optional. Disable its early boot-time load so
          # a missing working-directory icon can never prevent Kristal startup.
          conf = conf.replace(icon_setting, "t.window.icon = nil", 1)
          if 't.identity = "ten_shadows_kris"' not in conf:
              raise SystemExit("Could not set the game save identity")
          if 't.window.title = "Deltarune: Shadowbender"' not in conf:
              raise SystemExit("Could not set the game window title")
          if "t.window.icon = nil" not in conf:
              raise SystemExit("Could not disable optional boot-time window icon loading")
          conf_path.write_text(conf, encoding="utf-8")
          PY

      - name: Restore required Kristal main font
        run: |
          mkdir -p kristal-engine/assets/fonts
          cp assets/fonts/main.ttf assets/fonts/main.json assets/fonts/extra_mono.ttf assets/fonts/extra_mono.json kristal-engine/assets/fonts/
          test -s kristal-engine/assets/fonts/main.ttf
          test -s kristal-engine/assets/fonts/main.json
          test -s kristal-engine/assets/fonts/extra_mono.ttf
          test -s kristal-engine/assets/fonts/extra_mono.json

      - name: Build and verify .love archive
        run: |
          cd kristal-engine

          # main.lua requires this module during the first stage of engine boot.
          test -s src/engine/music.lua
          test -s src/engine/loadstate.lua
          test -s src/kristal.lua

          # Kristal reads this root-level file at startup to initialize SemVer.
          test -s VERSION
          grep -Eq '^[v]?[0-9]+([.][0-9]+){0,2}([+-].*)?$' VERSION

          zip -9 -r ../Deltarune-Shadowbender.love \
            VERSION assets configs data data_templates lib mods src \
            conf.lua gamecontrollerdb.txt icon.png main.lua LICENSE
          cd ..

          unzip -Z1 Deltarune-Shadowbender.love | grep -qx 'VERSION'
          unzip -p Deltarune-Shadowbender.love VERSION | grep -Eq '^[v]?[0-9]+([.][0-9]+){0,2}([+-].*)?$'
          unzip -Z1 Deltarune-Shadowbender.love | grep -qx 'conf.lua'
          unzip -Z1 Deltarune-Shadowbender.love | grep -qx 'main.lua'
          unzip -Z1 Deltarune-Shadowbender.love | grep -qx 'src/kristal.lua'
          unzip -Z1 Deltarune-Shadowbender.love | grep -qx 'src/engine/music.lua'
          unzip -Z1 Deltarune-Shadowbender.love | grep -qx 'src/engine/loadstate.lua'
          unzip -p Deltarune-Shadowbender.love src/engine/loadstate.lua > /tmp/kristal-loadstate.lua
          test -s /tmp/kristal-loadstate.lua
          grep -Fq 'function Loading:beginLoad()' /tmp/kristal-loadstate.lua
          echo "Kristal loadstate module verified ($(wc -c < /tmp/kristal-loadstate.lua) bytes)"
          unzip -p Deltarune-Shadowbender.love src/engine/music.lua > /tmp/kristal-music.lua
          test -s /tmp/kristal-music.lua
          echo "Kristal Music module verified ($(wc -c < /tmp/kristal-music.lua) bytes)"
          unzip -Z1 Deltarune-Shadowbender.love | grep -qx 'icon.png'
          unzip -p Deltarune-Shadowbender.love conf.lua | grep -Fq 't.window.icon = nil'
          unzip -Z1 Deltarune-Shadowbender.love | grep -qx 'assets/fonts/main.ttf'
          unzip -Z1 Deltarune-Shadowbender.love | grep -qx 'assets/fonts/extra_mono.ttf'
          unzip -Z1 Deltarune-Shadowbender.love | grep -qx 'assets/fonts/extra_mono.json'
          unzip -p Deltarune-Shadowbender.love assets/fonts/extra_mono.ttf > /tmp/ten-shadows-extra-mono.ttf
          test -s /tmp/ten-shadows-extra-mono.ttf
          echo "Extra font verified ($(wc -c < /tmp/ten-shadows-extra-mono.ttf) bytes)"
          unzip -p Deltarune-Shadowbender.love assets/fonts/main.ttf > /tmp/ten-shadows-main.ttf
          test -s /tmp/ten-shadows-main.ttf
          font_bytes=$(wc -c < /tmp/ten-shadows-main.ttf)
          if [ "$font_bytes" -lt 10000 ]; then
            echo "Bundled main.ttf is unexpectedly small ($font_bytes bytes)"
            exit 1
          fi
          echo "Bundled main.ttf verified ($font_bytes bytes)"
          unzip -Z1 Deltarune-Shadowbender.love | grep -qx 'mods/ten_shadows_kris/mod.json'

          if unzip -Z1 Deltarune-Shadowbender.love | grep -Eq '(^|/)\.git/|\.html$'; then
            echo "Unexpected development or HTML files found in .love archive"
            exit 1
          fi
          echo "Standalone LÖVE archive structure and VERSION verified"

      - name: Create standalone download bundle
        run: |
          mkdir -p standalone-download
          cp Deltarune-Shadowbender.love standalone-download/
          cat > standalone-download/README.txt <<'EOF'
          TEN SHADOWS KRIS - STANDALONE BUILD

          Launch Deltarune-Shadowbender.love with LÖVE 11.5.

          This is the complete standalone game archive. It includes the matching
          Kristal v0.10.0 engine and this mod, including assets/fonts/main.ttf.

          Do NOT launch the Deltarune-Shadowbender-mod package as a game. That package
          contains only the mod folder and must be installed inside an existing
          Kristal v0.10.0 installation.
          EOF
          cd standalone-download
          zip -9 -r ../Deltarune-Shadowbender-standalone.zip .

      - name: Upload standalone download bundle
        uses: actions/upload-artifact@v6
        with:
          name: Deltarune-Shadowbender-standalone-Love-11.5
          path: Deltarune-Shadowbender-standalone.zip
          if-no-files-found: error

      - name: Upload standalone .love archive
        uses: actions/upload-artifact@v6
        with:
          name: Deltarune-Shadowbender-love-file
          path: Deltarune-Shadowbender.love
          if-no-files-found: error
